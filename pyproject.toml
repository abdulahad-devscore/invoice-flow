[project]
name = "invoice-flow"
version = "1.0.0"
description = "Durable supplier-invoice automation: mailbox -> extraction -> 3-way match -> ERP, with a human queue."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "temporalio==1.34.0",
    "anthropic==2.3.0",
    "mcp==2.3.0",
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "sqlalchemy[asyncio]==2.1.6",
    "psycopg[binary]==3.3.6",
    "pdfplumber==0.11.10",
    "aio-pika==10.2.1",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
textract = ["boto3==1.43.119"]
demo = ["reportlab==5.1.0"]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.1", "aiosqlite==0.22.1", "reportlab==5.1.0", "ruff==0.15.2"]

[project.scripts]
invoice-flow = "invoice_flow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_flow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["ASYNC240"]
