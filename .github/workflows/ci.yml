name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts && ruff format --check src tests scripts
      # Workflow tests need a Temporal server: the SDK downloads its test server in CI.
      - name: pytest
        shell: bash
        run: |
          set -o pipefail
          pytest -q -rfE 2>&1 | tee pytest.log
      - name: Report test failures
        if: failure()
        shell: bash
        run: grep -E "^(FAILED|ERROR)|^E  " pytest.log | head -20 | sed "s/^/::error::/" || true
